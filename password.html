<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💕 Private Page</title>

<style>

/* ================================
   BASIC SETTINGS
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    /* =================================
       🖼️ BACKGROUND IMAGE YAHAN LAGEGI

       Apni photo ka naam:
       background.jpg

       Aur photo ko index.html ke
       SAME FOLDER mein rakho.
    ================================= */

    background-image:

        linear-gradient(
            rgba(255, 105, 180, 0.30),
            rgba(140, 70, 180, 0.35)
        ),

        url("background.jpg");
        /* 👆 PHOTO YAHAN SE LOAD HOGI */


    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

}


/* ================================
   PASSWORD BOX
================================ */

.box {

    width: 330px;

    padding: 28px;

    border-radius: 25px;

    text-align: center;


    /* Pink glass effect */

    background: rgba(255, 220, 240, 0.25);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);


    border: 1px solid rgba(255,255,255,0.45);


    box-shadow:

        0 15px 45px
        rgba(100, 20, 80, 0.45);

}


/* ================================
   TITLE
================================ */

h2 {

    color: white;

    margin-bottom: 20px;

    font-size: 26px;

    text-shadow:

        0 2px 8px
        rgba(100, 0, 60, 0.5);

}


/* ================================
   PASSWORD DISPLAY
================================ */

#display {

    width: 100%;

    height: 55px;

    border: none;

    outline: none;

    border-radius: 15px;

    margin-bottom: 18px;


    text-align: center;

    font-size: 25px;

    letter-spacing: 8px;


    color: #8e245d;

    background: rgba(255,255,255,0.92);


    box-shadow:

        inset 0 2px 8px
        rgba(150, 40, 100, 0.15);

}


/* ================================
   KEYPAD
================================ */

.keypad {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 11px;

}


/* ================================
   BUTTONS
================================ */

button {

    height: 58px;

    border: none;

    border-radius: 17px;

    font-size: 21px;

    font-weight: bold;

    cursor: pointer;


    color: #8e245d;


    background:
        rgba(255,255,255,0.88);


    box-shadow:

        0 5px 12px
        rgba(100, 20, 80, 0.18);


    transition:

        transform 0.15s,
        background 0.15s;

}


/* BUTTON PRESS */

button:active {

    transform: scale(0.90);

}


/* ================================
   CLEAR BUTTON
================================ */

.clear {

    background:

        linear-gradient(
            135deg,
            #ff7eb3,
            #ff4f9a
        );

    color: white;

}


/* ================================
   ENTER BUTTON
================================ */

.enter {

    background:

        linear-gradient(
            135deg,
            #d66cff,
            #a855f7
        );

    color: white;

}


/* ================================
   ERROR MESSAGE
================================ */

#message {

    color: white;

    margin-top: 15px;

    min-height: 22px;

    font-weight: bold;

    text-shadow:

        0 2px 5px
        rgba(80,0,50,0.5);

}

</style>

</head>


<body>


<!-- =================================
     🔐 PASSWORD PAGE
================================= -->

<div class="box">


    <h2>
        💕 Enter Password 💕
    </h2>


    <!-- PASSWORD DISPLAY -->

    <input
        type="password"
        id="display"
        readonly
    >


    <!-- =================================
         🔢 KEYPAD
    ================================= -->

    <div class="keypad">


        <button onclick="press('1')">
            1
        </button>

        <button onclick="press('2')">
            2
        </button>

        <button onclick="press('3')">
            3
        </button>


        <button onclick="press('4')">
            4
        </button>

        <button onclick="press('5')">
            5
        </button>

        <button onclick="press('6')">
            6
        </button>


        <button onclick="press('7')">
            7
        </button>

        <button onclick="press('8')">
            8
        </button>

        <button onclick="press('9')">
            9
        </button>


        <!-- CLEAR -->

        <button
            class="clear"
            onclick="clearPassword()"
        >
            C
        </button>


        <button onclick="press('0')">
            0
        </button>


        <!-- ENTER -->

        <button
            class="enter"
            onclick="checkPassword()"
        >
            ✓
        </button>


    </div>


    <!-- ERROR MESSAGE -->

    <div id="message"></div>


</div>



<script>


/* =================================
   🔐 PASSWORD
================================= */

const correctPassword = "773959";

let password = "";



/* =================================
   NUMBER PRESS
================================= */

function press(number) {


    if (password.length < 6) {


        password += number;


        document.getElementById(
            "display"
        ).value = password;


    }

}



/* =================================
   CLEAR PASSWORD
================================= */

function clearPassword() {


    password = "";


    document.getElementById(
        "display"
    ).value = "";


    document.getElementById(
        "message"
    ).innerText = "";


}



/* =================================
   CHECK PASSWORD
================================= */

function checkPassword() {


    if (password === correctPassword) {


        /*

        PASSWORD SAHI HAI ❤️

        Ab home.html khulega.

        */

        window.location.href =
            "lovestory.html";


    }

    else {


        document.getElementById(
            "message"
        ).innerText =
            "❌ Wrong Password";


        password = "";


        document.getElementById(
            "display"
        ).value = "";


    }

}


</script>


</body>
</html>
